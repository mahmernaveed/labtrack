            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },

    <style type="text/tailwindcss">

  <body
    class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans"
  >
    <div id="app"></div>

    <script>
      var qrcode = (function () {
        /**
         * qrcode
         * @param typeNumber 1 to 40
         * @param errorCorrectionLevel 'L','M','Q','H'
         */
        var qrcode = function (typeNumber, errorCorrectionLevel) {
          var PAD0 = 0xec;
          var PAD1 = 0x11;

          var _typeNumber = typeNumber;
          var _errorCorrectionLevel =
            QRErrorCorrectionLevel[errorCorrectionLevel];
          var _modules = null;
          var _moduleCount = 0;
          var _dataCache = null;
          var _dataList = [];

          var _this = {};

          var makeImpl = function (test, maskPattern) {
            _moduleCount = _typeNumber * 4 + 17;
            _modules = (function (moduleCount) {
              var modules = new Array(moduleCount);
              for (var row = 0; row < moduleCount; row += 1) {
                modules[row] = new Array(moduleCount);
                for (var col = 0; col < moduleCount; col += 1) {
                  modules[row][col] = null;
                }
              }
              return modules;
            })(_moduleCount);

            setupPositionProbePattern(0, 0);
            setupPositionProbePattern(_moduleCount - 7, 0);
            setupPositionProbePattern(0, _moduleCount - 7);
            setupPositionAdjustPattern();
            setupTimingPattern();
            setupTypeInfo(test, maskPattern);

            if (_typeNumber >= 7) {
              setupTypeNumber(test);
            }

            if (_dataCache == null) {
              _dataCache = createData(
                _typeNumber,
                _errorCorrectionLevel,
                _dataList,
              );
            }

            mapData(_dataCache, maskPattern);
          };

          var setupPositionProbePattern = function (row, col) {
            for (var r = -1; r <= 7; r += 1) {
              if (row + r <= -1 || _moduleCount <= row + r) continue;

              for (var c = -1; c <= 7; c += 1) {
                if (col + c <= -1 || _moduleCount <= col + c) continue;

                if (
                  (0 <= r && r <= 6 && (c == 0 || c == 6)) ||
                  (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
                  (2 <= r && r <= 4 && 2 <= c && c <= 4)
                ) {
                  _modules[row + r][col + c] = true;
                } else {
                  _modules[row + r][col + c] = false;
                }
              }
            }
          };

          var getBestMaskPattern = function () {
            var minLostPoint = 0;
            var pattern = 0;

            for (var i = 0; i < 8; i += 1) {
              makeImpl(true, i);

              var lostPoint = QRUtil.getLostPoint(_this);

              if (i == 0 || minLostPoint > lostPoint) {
                minLostPoint = lostPoint;
                pattern = i;
              }
            }

            return pattern;
          };

          var setupTimingPattern = function () {
            for (var r = 8; r < _moduleCount - 8; r += 1) {
              if (_modules[r][6] != null) {
                continue;
              }
              _modules[r][6] = r % 2 == 0;
            }

            for (var c = 8; c < _moduleCount - 8; c += 1) {
              if (_modules[6][c] != null) {
                continue;
              }
              _modules[6][c] = c % 2 == 0;
            }
          };

          var setupPositionAdjustPattern = function () {
            var pos = QRUtil.getPatternPosition(_typeNumber);

            for (var i = 0; i < pos.length; i += 1) {
              for (var j = 0; j < pos.length; j += 1) {
                var row = pos[i];
                var col = pos[j];

                if (_modules[row][col] != null) {
                  continue;
                }

                for (var r = -2; r <= 2; r += 1) {
                  for (var c = -2; c <= 2; c += 1) {
                    if (
                      r == -2 ||
                      r == 2 ||
                      c == -2 ||
                      c == 2 ||
                      (r == 0 && c == 0)
                    ) {
                      _modules[row + r][col + c] = true;
                    } else {
                      _modules[row + r][col + c] = false;
                    }
                  }
                }
              }
            }
          };

          var setupTypeNumber = function (test) {
            var bits = QRUtil.getBCHTypeNumber(_typeNumber);

            for (var i = 0; i < 18; i += 1) {
              var mod = !test && ((bits >> i) & 1) == 1;
              _modules[Math.floor(i / 3)][(i % 3) + _moduleCount - 8 - 3] = mod;
            }

            for (var i = 0; i < 18; i += 1) {
              var mod = !test && ((bits >> i) & 1) == 1;
              _modules[(i % 3) + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
            }
          };

          var setupTypeInfo = function (test, maskPattern) {
            var data = (_errorCorrectionLevel << 3) | maskPattern;
            var bits = QRUtil.getBCHTypeInfo(data);

            // vertical
            for (var i = 0; i < 15; i += 1) {
              var mod = !test && ((bits >> i) & 1) == 1;

              if (i < 6) {
                _modules[i][8] = mod;
              } else if (i < 8) {
                _modules[i + 1][8] = mod;
              } else {
                _modules[_moduleCount - 15 + i][8] = mod;
              }
            }

            // horizontal
            for (var i = 0; i < 15; i += 1) {
              var mod = !test && ((bits >> i) & 1) == 1;

              if (i < 8) {
                _modules[8][_moduleCount - i - 1] = mod;
              } else if (i < 9) {
                _modules[8][15 - i - 1 + 1] = mod;
              } else {
                _modules[8][15 - i - 1] = mod;
              }
            }

            _modules[_moduleCount - 8][8] = !test;
          };

          var mapData = function (data, maskPattern) {
            var inc = -1;
            var row = _moduleCount - 1;
            var bitIndex = 7;
            var byteIndex = 0;
            var maskFunc = QRUtil.getMaskFunction(maskPattern);

            for (var col = _moduleCount - 1; col > 0; col -= 2) {
              if (col == 6) col -= 1;

              while (true) {
                for (var c = 0; c < 2; c += 1) {
                  if (_modules[row][col - c] == null) {
                    var dark = false;

                    if (byteIndex < data.length) {
                      dark = ((data[byteIndex] >>> bitIndex) & 1) == 1;
                    }

                    var mask = maskFunc(row, col - c);

                    if (mask) {
                      dark = !dark;
                    }

                    _modules[row][col - c] = dark;
                    bitIndex -= 1;

                    if (bitIndex == -1) {
                      byteIndex += 1;
                      bitIndex = 7;
                    }
                  }
                }

                row += inc;

                if (row < 0 || _moduleCount <= row) {
                  row -= inc;
                  inc = -inc;
                  break;
                }
              }
            }
          };

          var createBytes = function (buffer, rsBlocks) {
            var offset = 0;

            var maxDcCount = 0;
            var maxEcCount = 0;

            var dcdata = new Array(rsBlocks.length);
            var ecdata = new Array(rsBlocks.length);

            for (var r = 0; r < rsBlocks.length; r += 1) {
              var dcCount = rsBlocks[r].dataCount;
              var ecCount = rsBlocks[r].totalCount - dcCount;

              maxDcCount = Math.max(maxDcCount, dcCount);
              maxEcCount = Math.max(maxEcCount, ecCount);

              dcdata[r] = new Array(dcCount);

              for (var i = 0; i < dcdata[r].length; i += 1) {
                dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
              }
              offset += dcCount;

              var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
              var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

              var modPoly = rawPoly.mod(rsPoly);
              ecdata[r] = new Array(rsPoly.getLength() - 1);
              for (var i = 0; i < ecdata[r].length; i += 1) {
                var modIndex = i + modPoly.getLength() - ecdata[r].length;
                ecdata[r][i] = modIndex >= 0 ? modPoly.getAt(modIndex) : 0;
              }
            }

            var totalCodeCount = 0;
            for (var i = 0; i < rsBlocks.length; i += 1) {
              totalCodeCount += rsBlocks[i].totalCount;
            }

            var data = new Array(totalCodeCount);
            var index = 0;

            for (var i = 0; i < maxDcCount; i += 1) {
              for (var r = 0; r < rsBlocks.length; r += 1) {
                if (i < dcdata[r].length) {
                  data[index] = dcdata[r][i];
                  index += 1;
                }
              }
            }

            for (var i = 0; i < maxEcCount; i += 1) {
              for (var r = 0; r < rsBlocks.length; r += 1) {
                if (i < ecdata[r].length) {
                  data[index] = ecdata[r][i];
                  index += 1;
                }
              }
            }

            return data;
          };

          var createData = function (
            typeNumber,
            errorCorrectionLevel,
            dataList,
          ) {
            var rsBlocks = QRRSBlock.getRSBlocks(
              typeNumber,
              errorCorrectionLevel,
            );

            var buffer = qrBitBuffer();

            for (var i = 0; i < dataList.length; i += 1) {
              var data = dataList[i];
              buffer.put(data.getMode(), 4);
              buffer.put(
                data.getLength(),
                QRUtil.getLengthInBits(data.getMode(), typeNumber),
              );
              data.write(buffer);
            }

            // calc num max data.
            var totalDataCount = 0;
            for (var i = 0; i < rsBlocks.length; i += 1) {
              totalDataCount += rsBlocks[i].dataCount;
            }

            if (buffer.getLengthInBits() > totalDataCount * 8) {
              throw (
                "code length overflow. (" +
                buffer.getLengthInBits() +
                ">" +
                totalDataCount * 8 +
                ")"
              );
            }

            // end code
            if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
              buffer.put(0, 4);
            }

            // padding
            while (buffer.getLengthInBits() % 8 != 0) {
              buffer.putBit(false);
            }

            // padding
            while (true) {
              if (buffer.getLengthInBits() >= totalDataCount * 8) {
                break;
              }
              buffer.put(PAD0, 8);

              if (buffer.getLengthInBits() >= totalDataCount * 8) {
                break;
              }
              buffer.put(PAD1, 8);
            }

            return createBytes(buffer, rsBlocks);
          };

          _this.addData = function (data, mode) {
            mode = mode || "Byte";

            var newData = null;

            switch (mode) {
              case "Numeric":
                newData = qrNumber(data);
                break;
              case "Alphanumeric":
                newData = qrAlphaNum(data);
                break;
              case "Byte":
                newData = qr8BitByte(data);
                break;
              case "Kanji":
                newData = qrKanji(data);
                break;
              default:
                throw "mode:" + mode;
            }

            _dataList.push(newData);
            _dataCache = null;
          };

          _this.isDark = function (row, col) {
            if (
              row < 0 ||
              _moduleCount <= row ||
              col < 0 ||
              _moduleCount <= col
            ) {
              throw row + "," + col;
            }
            return _modules[row][col];
          };

          _this.getModuleCount = function () {
            return _moduleCount;
          };

          _this.make = function () {
            if (_typeNumber < 1) {
              var typeNumber = 1;

              for (; typeNumber < 40; typeNumber++) {
                var rsBlocks = QRRSBlock.getRSBlocks(
                  typeNumber,
                  _errorCorrectionLevel,
                );
                var buffer = qrBitBuffer();

                for (var i = 0; i < _dataList.length; i++) {
                  var data = _dataList[i];
                  buffer.put(data.getMode(), 4);
                  buffer.put(
                    data.getLength(),
                    QRUtil.getLengthInBits(data.getMode(), typeNumber),
                  );
                  data.write(buffer);
                }

                var totalDataCount = 0;
                for (var i = 0; i < rsBlocks.length; i++) {
                  totalDataCount += rsBlocks[i].dataCount;
                }

                if (buffer.getLengthInBits() <= totalDataCount * 8) {
                  break;
                }
              }

              _typeNumber = typeNumber;
            }

            makeImpl(false, getBestMaskPattern());
          };

          _this.createTableTag = function (cellSize, margin) {
            cellSize = cellSize || 2;
            margin = typeof margin == "undefined" ? cellSize * 4 : margin;

            var qrHtml = "";

            qrHtml += '<table style="';
            qrHtml += " border-width: 0px; border-style: none;";
            qrHtml += " border-collapse: collapse;";
            qrHtml += " padding: 0px; margin: " + margin + "px;";
            qrHtml += '">';
            qrHtml += "<tbody>";

            for (var r = 0; r < _this.getModuleCount(); r += 1) {
              qrHtml += "<tr>";

              for (var c = 0; c < _this.getModuleCount(); c += 1) {
                qrHtml += '<td style="';
                qrHtml += " border-width: 0px; border-style: none;";
                qrHtml += " border-collapse: collapse;";
                qrHtml += " padding: 0px; margin: 0px;";
                qrHtml += " width: " + cellSize + "px;";
                qrHtml += " height: " + cellSize + "px;";
                qrHtml += " background-color: ";
                qrHtml += _this.isDark(r, c) ? "#000000" : "#ffffff";
                qrHtml += ";";
                qrHtml += '"/>';
              }

              qrHtml += "</tr>";
            }

            qrHtml += "</tbody>";
            qrHtml += "</table>";

            return qrHtml;
          };

          _this.createSvgTag = function (cellSize, margin, alt, title) {
            var opts = {};
            if (typeof arguments[0] == "object") {
              // Called by options.
              opts = arguments[0];
              // overwrite cellSize and margin.
              cellSize = opts.cellSize;
              margin = opts.margin;
              alt = opts.alt;
              title = opts.title;
            }

            cellSize = cellSize || 2;
            margin = typeof margin == "undefined" ? cellSize * 4 : margin;

            alt = typeof alt === "string" ? { text: alt } : alt || {};
            alt.text = alt.text || null;
            alt.id = alt.text ? alt.id || "qrcode-description" : null;

            title = typeof title === "string" ? { text: title } : title || {};
            title.text = title.text || null;
            title.id = title.text ? title.id || "qrcode-title" : null;

            var size = _this.getModuleCount() * cellSize + margin * 2;
            var c,
              mc,
              r,
              mr,
              qrSvg = "",
              rect;

            rect =
              "l" +
              cellSize +
              ",0 0," +
              cellSize +
              " -" +
              cellSize +
              ",0 0,-" +
              cellSize +
              "z ";

            qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
            qrSvg += !opts.scalable
              ? ' width="' + size + 'px" height="' + size + 'px"'
              : "";
            qrSvg += ' viewBox="0 0 ' + size + " " + size + '" ';
            qrSvg += ' preserveAspectRatio="xMinYMin meet"';
            qrSvg +=
              title.text || alt.text
                ? ' role="img" aria-labelledby="' +
                  escapeXml([title.id, alt.id].join(" ").trim()) +
                  '"'
                : "";
            qrSvg += ">";
            qrSvg += title.text
              ? '<title id="' +
                escapeXml(title.id) +
                '">' +
                escapeXml(title.text) +
                "</title>"
              : "";
            qrSvg += alt.text
              ? '<description id="' +
                escapeXml(alt.id) +
                '">' +
                escapeXml(alt.text) +
                "</description>"
              : "";
            qrSvg +=
              '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
            qrSvg += '<path d="';

            for (r = 0; r < _this.getModuleCount(); r += 1) {
              mr = r * cellSize + margin;
              for (c = 0; c < _this.getModuleCount(); c += 1) {
                if (_this.isDark(r, c)) {
                  mc = c * cellSize + margin;
                  qrSvg += "M" + mc + "," + mr + rect;
                }
              }
            }

            qrSvg += '" stroke="transparent" fill="black"/>';
            qrSvg += "</svg>";

            return qrSvg;
          };

          _this.createDataURL = function (cellSize, margin) {
            cellSize = cellSize || 2;
            margin = typeof margin == "undefined" ? cellSize * 4 : margin;

            var size = _this.getModuleCount() * cellSize + margin * 2;
            var min = margin;
            var max = size - margin;

            return createDataURL(size, size, function (x, y) {
              if (min <= x && x < max && min <= y && y < max) {
                var c = Math.floor((x - min) / cellSize);
                var r = Math.floor((y - min) / cellSize);
                return _this.isDark(r, c) ? 0 : 1;
              } else {
                return 1;
              }
            });
          };

          _this.createImgTag = function (cellSize, margin, alt) {
            cellSize = cellSize || 2;
            margin = typeof margin == "undefined" ? cellSize * 4 : margin;

            var size = _this.getModuleCount() * cellSize + margin * 2;

            var img = "";
            img += "<img";
            img += '\u0020src="';
            img += _this.createDataURL(cellSize, margin);
            img += '"';
            img += '\u0020width="';
            img += size;
            img += '"';
            img += '\u0020height="';
            img += size;
            img += '"';
            if (alt) {
              img += '\u0020alt="';
              img += escapeXml(alt);
              img += '"';
            }
            img += "/>";

            return img;
          };

          var escapeXml = function (s) {
            var escaped = "";
            for (var i = 0; i < s.length; i += 1) {
              var c = s.charAt(i);
              switch (c) {
                case "<":
                  escaped += "&lt;";
                  break;
                case ">":
                  escaped += "&gt;";
                  break;
                case "&":
                  escaped += "&amp;";
                  break;

      const now = () => new Date();
      const iso = (d) => d.toISOString();
      const hoursAgo = (h) => {
        const d = new Date();
        d.setHours(d.getHours() - h);

      const minsAgo = (m) => {

      let idCounter = 1000;
      const genId = (prefix) => `${prefix}-${Date.now()}-${++idCounter}`;
      let eventCounter = 0;
      const ev = (status, label, user, department, timestamp, note) => ({
        id: `ev-${++eventCounter}`,
        status,
        label,
        user,
        department,
        timestamp,
        note,

      const timeAgo = (isoStr) => {
        const diff = Date.now() - new Date(isoStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins} min ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs} hr ago`;
        const days = Math.floor(hrs / 24);
        return `${days} day${days > 1 ? "s" : ""} ago`;
      };

      const formatDate = (isoStr) =>
        new Date(isoStr).toLocaleDateString("en-IE", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      const formatTime = (isoStr) =>
        new Date(isoStr).toLocaleTimeString("en-IE", {

      const formatDateTime = (isoStr) =>
        `${formatDate(isoStr)} · ${formatTime(isoStr)}`;

      // ============= QR CODE (real, scannable — via embedded qrcode-generator lib) =============
      function qrCodeSVG(value, size = 160) {
        const qr = qrcode(0, "M");
        qr.addData(String(value));
        qr.make();
        const count = qr.getModuleCount();
        const margin = 2; // quiet zone, in modules — required for reliable scanning
        const cell = size / (count + margin * 2);
        let rects = "";
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              const x = (c + margin) * cell,
                y = (r + margin) * cell;
              rects += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#0f172a"/>`;
            }
          }
        }
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code" class="rounded-lg">${rects ? `<rect width="${size}" height="${size}" fill="white"/>${rects}` : ""}</svg>`;
      }
      // Compact human-readable payload so a phone camera / scanner app shows the
      // key sample details immediately, without needing to open LabTrack.
      function qrPayload(t) {
        return [
          `LabTrack Transfer: ${t.id}`,
          `MRN: ${t.mrn}`,
          `Patient: ${t.patientName}`,
          `From: ${t.location}`,
          `To: ${t.destinationLab}`,
          `Samples: ${t.samples ? t.samples.length : 0}`,
          `Priority: ${t.priority}`,
        ].join("\n");
      }
      function barcodeSVG(value, height = 44) {
        const bars = [];
        let x = 0;
        for (let n = 0; n < value.length; n++) {
          const code = value.charCodeAt(n);
          const w1 = (code & 7) + 1,
            w2 = ((code >> 3) & 7) + 1;
          bars.push({ x, w: w1 });
          x += w1;
          bars.push({ x, w: 0 });
          x += 1;
          bars.push({ x, w: w2 });
          x += w2;
          bars.push({ x, w: 0 });
          x += 1;

            (b) =>
              `<rect x="${b.x}" y="0" width="${b.w}" height="${height}" fill="#0f172a"/>`,
          )
          .join("");
        return `<div class="inline-block"><svg width="${totalWidth}" height="${height}" viewBox="0 0 ${totalWidth} ${height}">${rects}</svg><div class="text-[10px] font-mono tracking-widest text-slate-600 dark:text-slate-400 mt-1 text-center">${value}</div></div>`;

        const id = genId("toast");

      function createTransfer(data) {
        const id = `TRX-2026-${String(149 + Math.floor(Math.random() * 800)).padStart(5, "0")}`;
        const now = new Date().toISOString();
        const transfer = {
          id,
          ...data,
          createdAt: now,
          timeline: [
            {
              id: genId("ev"),
              status: "created",
              label: "Transfer Created",
              user: state.currentUser.name,
              department: data.department,
              timestamp: now,
            },
          ],
        };
        state.transfers.unshift(transfer);
        return transfer;
      }

      function collectTransfer(id, porterName) {
        const t = state.transfers.find((t) => t.id === id);
        if (!t) return;
        t.status = "collected";
        t.collectedBy = porterName;
        t.timeline.push({
          id: genId("ev"),
          status: "collected",
          label: "Collected by Porter",
          user: porterName,
          department: "Transport",
          timestamp: new Date().toISOString(),
          note: `Collected by ${porterName}`,
        });
        render();
      }

      function receiveTransfer(
        id,
        receivedBy,
        date,
        time,
        labNotes,
        sampleIds,
      ) {
        const t = state.transfers.find((t) => t.id === id);
        if (!t) return;
        t.status = "received";
        t.receivedBy = receivedBy;
        t.receiveDate = date;
        t.receiveTime = time;
        t.labNotes = labNotes;
        t.samples.forEach((s) => {
          if (sampleIds.includes(s.id)) s.received = true;
        });
        t.timeline.push({
          id: genId("ev"),
          status: "received",
          label: "Received at Lab",
          user: receivedBy,
          department: t.destinationLab,
          timestamp: new Date().toISOString(),
          note: `${sampleIds.length} of ${t.samples.length} samples verified`,
        });
        render();
      }

      function completeTransfer(id) {
        const t = state.transfers.find((t) => t.id === id);

        if (t.status !== "received") {

        t.status = "completed";

          user: state.currentUser.name,
          department: t.destinationLab,

      function BarChart(data, color = "#2563eb", height = 200) {
        const max = Math.max(...data.map((d) => d.value), 1);
        const barWidth = 100 / data.length;

        let bars = "";

        data.forEach((d, i) => {
          const h = (d.value / max) * (height / 2 - 20);

          const x = i * barWidth + barWidth * 0.15;
          const y = height / 2 - h - 4;
          const width = barWidth * 0.7;

          bars += `
      <!-- Number above bar -->
      <text
        x="${x + width / 2}"
        y="${y - 3}"
        text-anchor="middle"
        font-size="5"
        fill="currentColor"
        class="text-slate-600 dark:text-slate-300 font-semibold"
      >
        ${d.value}
      </text>

      <!-- Bar -->
      <rect
        x="${x}"
        y="${y}"
        width="${width}"
        height="${h}"
        rx="0.5"
        fill="${color}"
        opacity="0.85"
      />
    `;
        });

        const labels = data
          .map(
            (d) =>
              `<span class="text-[10px] text-slate-400 font-medium flex-1 text-center">${d.label}</span>`,
          )
          .join("");

        return `
    <div class="w-full" style="height:${height}px">
      <svg viewBox="0 0 100 ${height / 2}" preserveAspectRatio="none" class="w-full h-full">
        ${bars}
      </svg>
      <div class="flex justify-between mt-1">
        ${labels}
      </div>
    </div>
  `;
      }

      function LineChart(data, height = 200, color = "#2563eb") {
        const max = Math.max(...data.map((d) => d.value), 1);
        const min = Math.min(...data.map((d) => d.value), 0);
        const range = max - min || 1;
        const w = 100,
          h = height / 2;
        const points = data.map((d, i) => {
          const x = (i / (data.length - 1 || 1)) * w;
          const y = h - ((d.value - min) / range) * (h - 10) - 5;
          return { x, y, ...d };
        });
        const path = points
          .map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`)
          .join(" ");
        const areaPath = `${path} L ${w} ${h} L 0 ${h} Z`;
        const dots = points
          .map(
            (p) =>
              `<circle cx="${p.x}" cy="${p.y}" r="1.5" fill="white" stroke="${color}" stroke-width="1"/>`,
          )
          .join("");
        const labels = data
          .map(
            (d) =>
              `<span class="text-[10px] text-slate-400 font-medium">${d.label}</span>`,
          )
          .join("");
        return `<div class="w-full" style="height:${height}px"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-full"><defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${areaPath}" fill="url(#lineGrad)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><div class="flex justify-between mt-1">${labels}</div></div>`;
      }

      function DonutChart(data, size = 160) {
        const total = data.reduce((s, d) => s + d.value, 0) || 1;
        const radius = 40;
        const circumference = 2 * Math.PI * radius;
        let offset = 0;
        const circles = data
          .map((d) => {
            const len = (d.value / total) * circumference;
            const circle = `<circle cx="50" cy="50" r="${radius}" fill="none" stroke="${d.color}" stroke-width="12" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}" stroke-linecap="round"/>`;
            offset += len;
            return circle;
          })
          .join("");
        const legend = data
          .map(
            (d) =>
              `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${d.color}"></span><span class="text-xs font-medium text-slate-600 dark:text-slate-300">${d.label}</span><span class="text-xs font-bold text-slate-800 dark:text-slate-100 ml-auto">${d.value}</span></div>`,
          )
          .join("");
        return `<div class="flex items-center gap-5"><svg width="${size}" height="${size}" viewBox="0 0 100 100" class="-rotate-70">${circles}<text x="50" y="50" text-anchor="middle" dominant-baseline="middle" fill="currentColor" font-size="14" font-weight="700">${total}</text></svg><div class="flex flex-col gap-2">${legend}</div></div>`;
      }

      function ProgressRing(
        value,
        max,
        size = 120,
        color = "#2563eb",
        label = "",
      ) {
        const pct = Math.min(value / max, 1);
        const radius = 42;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference * (1 - pct);
        return `<div class="relative inline-flex items-center justify-center" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 100 100" class="-rotate-90"><circle cx="50" cy="50" r="${radius}" fill="none" stroke="currentColor" stroke-width="8" class="text-slate-100 dark:text-slate-800"/><circle cx="50" cy="50" r="${radius}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" class="transition-all duration-700"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-2xl font-bold text-slate-900 dark:text-white">${value}</span>${label ? `<span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">${label}</span>` : ""}</div></div>`;

      function paginationHTML(page, totalPages, totalItems, pageSize, prevExpr, nextExpr) {
        if (totalItems === 0) return "";
        const start = (page - 1) * pageSize + 1;
        const end = Math.min(page * pageSize, totalItems);
        return `<div class="flex items-center justify-between gap-3 px-5 py-3 border-t border-slate-100 dark:border-slate-800"><p class="text-xs text-slate-500 dark:text-slate-400">Showing ${start}–${end} of ${totalItems}</p><div class="flex items-center gap-2"><button ${page <= 1 ? "disabled" : ""} onclick="${prevExpr}" class="btn-secondary text-xs px-3 py-1.5 disabled:opacity-40 disabled:cursor-not-allowed">${i("arrowLeft", 14)} Prev</button><span class="text-xs font-medium text-slate-600 dark:text-slate-300">Page ${page} of ${totalPages}</span><button ${page >= totalPages ? "disabled" : ""} onclick="${nextExpr}" class="btn-secondary text-xs px-3 py-1.5 disabled:opacity-40 disabled:cursor-not-allowed">Next ${i("arrowRight", 14)}</button></div></div>`;
      }

      // Expands each sample entry into one row per physical sample, using
      // its "count" field, so the Sample ID / Specimen Type lists always
      // add up to the real "No. of Samples" total instead of listing just
      // one line per entry regardless of its count.
      function expandSampleUnits(t) {
        const units = [];
        (t.samples || []).forEach((s, idx) => {
          const cnt = Math.max(1, parseInt(s.count, 10) || 1);
          const baseLabel = s.label || `S-${idx + 1}`;
          for (let n = 1; n <= cnt; n++) {
            units.push({
              label: cnt > 1 ? `${baseLabel}-${n}` : baseLabel,
              specimenType: s.specimenType || "—",
            });
          }
        });
        return units;
      }

      function sampleNumbersHTML(t) {
        const units = expandSampleUnits(t);
        if (units.length === 0)
          return '<span class="text-slate-400">—</span>';
        if (units.length === 1)
          return `<span class="font-mono">${units[0].label}</span>`;
        return `<ul class="list-none list-inside space-y-0.5">${units.map((u) => `<li class="font-mono">${u.label}</li>`).join("")}</ul>`;
      }

      function specimenTypesHTML(t) {
        const units = expandSampleUnits(t);
        if (units.length === 0) return '<span class="text-slate-400">—</span>';
        if (units.length === 1) return units[0].specimenType;
        return `<ul class="list-none list-inside space-y-0.5">${units.map((u) => `<li>${u.specimenType}</li>`).join("")}</ul>`;
      }

<button onclick="setPage('create')"

  ${paginationHTML(state.dashboardPage, dashTotalPages, recentAll.length, DASH_PAGE_SIZE, "state.dashboardPage--;render()", "state.dashboardPage++;render()")}

      function ensureHistPanel() {
        if (histPanelEl && document.body.contains(histPanelEl))
          return histPanelEl;
        const panel = document.createElement("div");
        panel.id = "histFloatingPanel";
        panel.className =
          "hidden fixed z-50 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-elevated overflow-hidden";

      <div id="histFloatingList" class="max-h-64 overflow-y-auto"></div>`;
        document.body.appendChild(panel);
        histPanelEl = panel;
        return panel;
      }

      function positionHistPanel(btnEl) {
        if (!btnEl || !histPanelEl) return;
        const rect = btnEl.getBoundingClientRect();
        const panel = histPanelEl;
        panel.style.width = Math.max(rect.width, 288) + "px";
        const panelHeight = panel.offsetHeight || 320;
        let top = rect.bottom + 6;
        if (top + panelHeight > window.innerHeight - 8)
          top = Math.max(8, rect.top - panelHeight - 6);
        let left = rect.left;
        const panelWidth = panel.offsetWidth || 288;
        if (left + panelWidth > window.innerWidth - 8)
          left = window.innerWidth - panelWidth - 8;
        if (left < 8) left = 8;
        panel.style.top = top + "px";
        panel.style.left = left + "px";
      }

      function toggleHistCombo(id, btnEl) {
        const panel = ensureHistPanel();
        const isOpen =
          openHistComboId === id && !panel.classList.contains("hidden");
        closeAllHistCombos();
        if (isOpen) return;
        const row = state.createForm.histologySamples.find((x) => x.id === id);
        if (!row) return;
        openHistComboId = id;
        histActiveTriggerEl = btnEl;
        row.query = ""; // always start browsing from the full list
        panel.querySelector("#histFloatingSearch").value = "";
        panel.querySelector("#histFloatingClear").classList.add("hidden");
        panel.querySelector("#histFloatingList").innerHTML =
          buildHistListHTML(id);
        panel.classList.remove("hidden");
        positionHistPanel(btnEl);
        panel.querySelector("#histFloatingSearch").focus();
      }

      function closeAllHistCombos() {
        if (histPanelEl) histPanelEl.classList.add("hidden");
        openHistComboId = null;
        histActiveTriggerEl = null;
      }

        if (!openHistComboId) return;

        row.query = val;
        histPanelEl
          .querySelector("#histFloatingClear")
          .classList.toggle("hidden", !val);
        histPanelEl.querySelector("#histFloatingList").innerHTML =
          buildHistListHTML(openHistComboId);
      }

        if (!openHistComboId) return;
        const row = state.createForm.histologySamples.find(
          (x) => x.id === openHistComboId,

        row.query = "";
        const inp = histPanelEl.querySelector("#histFloatingSearch");
        inp.value = "";

        histPanelEl.querySelector("#histFloatingClear").classList.add("hidden");
        histPanelEl.querySelector("#histFloatingList").innerHTML =

        if (!query) {
          return (

              .sort((a, b) => a.localeCompare(b))
              .map((t) => histOptionRowHTML(t, row.type))
              .join("") + histOptionRowHTML("Other", row.type)
          );

        const matches = HISTOLOGY_FLAT_LIST.filter((t) =>
          t.toLowerCase().includes(query),

      function sampleIdSourceB(r) {
        if (r.category === "Other") return r.otherCategory || r.type || "Sample";

      function generateSampleIdB(rows, r) {
        const letter = (sampleIdSourceB(r).trim().charAt(0) || "S").toUpperCase();
        let ordinal = 0;
        for (const row of rows) {
          if ((sampleIdSourceB(row).trim().charAt(0) || "S").toUpperCase() === letter) {
            ordinal++;
            if (row.id === r.id) break;
          }
        }
        return `${letter}${String(ordinal).padStart(3, "0")}`;
      }

${

      // ---- Simple Lab Home: 2 tiles + MRN search + sample detail with Received button and one notes field ----
      function renderLabHome() {
        const awaiting = state.transfers.filter(
          (t) =>
            t.status === "pending" ||
            t.status === "in_transit" ||
            t.status === "collected",
        );
        const completed = state.transfers.filter(
          (t) => t.status === "completed",
        );

        const cards = [
          {
            label: "Awaiting Collection",
            value: awaiting.length,
            icon: "clipboardCheck",
            bg: "bg-amber-50 dark:bg-amber-500/10",
            iconColor: "text-amber-600 dark:text-amber-400",
          },
          {
            label: "Transfer Completed",
            value: completed.length,
            icon: "check",
            bg: "bg-green-50 dark:bg-green-500/10",
            iconColor: "text-green-600 dark:text-green-400",
          },
        ];
        const cardHtml = cards
          .map(
            (
              c,
            ) => `<div class="card rounded-xl border border-gray-200 bg-white shadow-sm p-5">
        <div class="flex items-start justify-between"><div class="w-12 h-12 rounded-xl ${c.bg} flex items-center justify-center">${i(c.icon, 24, c.iconColor)}</div><span class="text-xs font-semibold text-slate-400 dark:text-slate-500">24 h</span></div>
        <div class="text-center mt-2">
        <p class="text-3xl font-bold text-slate-900 dark:text-white">${c.value}</p>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${c.label}</p>
        </div>
      </div>`,
          )
          .join("");

        const query = (state.labSearchQuery || "").trim().toLowerCase();
        const originOptions = [
          ...new Set(state.transfers.map((t) => t.location).filter(Boolean)),
        ].sort((a, b) => a.localeCompare(b));
        const LAB_DASH_PAGE_SIZE = 10;
        const listAll = sortPendingThenReceived(
          state.transfers
            .filter((t) =>
              [
                "pending",
                "in_transit",
                "collected",
                "received",
                "completed",
              ].includes(t.status),
            )
            .filter(
              (t) =>
                !query ||
                t.mrn.toLowerCase().includes(query) ||
                t.id.toLowerCase().includes(query),
            )
            .filter(
              (t) =>
                !state.dashboardOriginFilter ||
                t.location === state.dashboardOriginFilter,
            ),
        );
        const labDashTotalPages = Math.max(
          1,
          Math.ceil(listAll.length / LAB_DASH_PAGE_SIZE),
        );
        if (state.labDashboardPage > labDashTotalPages)
          state.labDashboardPage = labDashTotalPages;
        if (state.labDashboardPage < 1) state.labDashboardPage = 1;
        const list = listAll.slice(
          (state.labDashboardPage - 1) * LAB_DASH_PAGE_SIZE,
          state.labDashboardPage * LAB_DASH_PAGE_SIZE,
        );

        const rows = list
          .map((t) => {
            const isReceived =

          : `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div><label class="label">${i("user", 11)} Received By</label><input class="input" value="${state.receivedBy}" onchange="state.receivedBy=this.value;render()"></div><div><label class="label">${i("calendar", 11)} Receive Date</label><input type="date" class="input" value="${state.receiveDate}" onchange="state.receiveDate=this.value;render()"></div><div><label class="label">${i("clock", 11)} Receive Time</label><input type="time" class="input" value="${state.receiveTime}" onchange="state.receiveTime=this.value;render()"></div></div>`;
        const actionButtons = !isReceived

      <button

          : "";
        return `<div class="space-y-5 max-w-[1600px] mx-auto"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Receive Samples</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Verify and receive incoming sample transfers at the lab</p></div><div class="grid grid-cols-1 lg:grid-cols-5 gap-4"><div class="lg:col-span-2 space-y-3"><h3 class="text-sm font-bold text-slate-700 dark:text-slate-200 px-1">Awaiting Verification (${receivable.length})</h3>${listItems}</div><div class="lg:col-span-3">${selected ? `<div class="card p-6"><div class="flex items-center justify-between mb-5"><div><h3 class="text-lg font-bold text-slate-900 dark:text-white">Lab Verification</h3><p class="text-xs font-mono text-slate-500 mt-0.5">${selected.id}</p></div>${PriorityBadge(selected.priority)}</div><div class="mb-5"><h4 class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-2 flex items-center gap-2">${i("packageCheck", 16, "text-brand-500")} Sample Verification</h4><div class="rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800"><th class="px-3 py-2.5 font-semibold w-10 text-center">✓</th><th class="px-3 py-2.5 font-semibold">Label</th><th class="px-3 py-2.5 font-semibold">Type</th><th class="px-3 py-2.5 font-semibold text-center">Count</th><th class="px-3 py-2.5 font-semibold">Remarks</th></tr></thead><tbody>${sampleRows}</tbody></table></div><p class="text-xs text-slate-500 mt-2">${state.checkedSamples.size} of ${selected.samples.length} samples verified</p></div>${receiptFields}<div class="mb-5"><label class="label">${i("fileText", 11)} Lab Notes</label><textarea class="input min-h-[70px] resize-y" onchange="state.labNotes=this.value;render()" placeholder="Notes on sample condition...">${state.labNotes}</textarea></div>${actionButtons}</div>` : ""}</div></div></div>`;
      }

      function getFilteredHistoryTransfers() {
        return sortPendingThenReceived(
          state.transfers.filter((t) => {
            const matchQuery =
              !state.historyQuery ||
              t.mrn.toLowerCase().includes(state.historyQuery.toLowerCase()) ||
              t.patientName
                .toLowerCase()
                .includes(state.historyQuery.toLowerCase()) ||
              t.id.toLowerCase().includes(state.historyQuery.toLowerCase());
            const matchStatus = ["received", "completed", "rejected"].includes(
              t.status,
            );
            const matchLocation =
              !state.historyLocationFilter ||
              t.location === state.historyLocationFilter;
            return matchQuery && matchStatus && matchLocation;
          }),
        );
      }

      function exportHistoryToExcel() {
        const rows = getFilteredHistoryTransfers();
        if (rows.length === 0) {
          showToast("error", "No transfers to export");
          return;
        }
        if (typeof XLSX === "undefined") {
          showToast("error", "Export library failed to load");
          return;
        }
        const data = rows.map((t) => ({
          "Transfer ID": t.id,
          MRN: t.mrn,
          "Patient Name": t.patientName,
          Priority: t.priority,
          Status: t.status,
          "Pickup Location": t.location,
          "Destination Lab": t.destinationLab,
          Consultant: t.consultant || "",
          "Collection Date": t.collectionDate || "",
          "Collection Time": t.collectionTime || "",
          "Request Date": formatDate(t.createdAt),
          "Request Time": formatTime(t.createdAt),
          "Received By": t.receivedBy || "",
          "Receive Date": t.receiveDate || "",
          "Receive Time": t.receiveTime || "",
          "Lab Notes": t.labNotes || "",
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        ws["!cols"] = Object.keys(data[0]).map((k) => ({
          wch: Math.max(k.length, 16),
        }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Transfer History");
        XLSX.writeFile(
          wb,
          `LabTrack-Transfer-History-${todayDate()}.xlsx`,
        );
        showToast("success", "Transfer history exported");
      }

      function renderHistory() {
        const HISTORY_PAGE_SIZE = 5;

          ...new Set(state.transfers.map((t) => t.location).filter(Boolean)),
        ].sort((a, b) => a.localeCompare(b));
        const filtered = getFilteredHistoryTransfers();
        const totalPages = Math.max(
          1,
          Math.ceil(filtered.length / HISTORY_PAGE_SIZE),
        );
        if (state.historyPage > totalPages) state.historyPage = totalPages;
        if (state.historyPage < 1) state.historyPage = 1;
        const pageItems = filtered.slice(
          (state.historyPage - 1) * HISTORY_PAGE_SIZE,
          state.historyPage * HISTORY_PAGE_SIZE,

          .map(
            (t) =>
              `<div class="card card-hover p-5"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center">${i("package", 20, "text-brand-600 dark:text-brand-400")}</div><div><p class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.mrn}</p><p class="text-xs text-slate-500 dark:text-slate-400">${t.patientName}</p></div></div><div class="flex items-center gap-2 flex-wrap">${StatusBadge(t.status)}<span class="text-xs text-slate-400">${timeAgo(t.createdAt)}</span>${state.persona === "theatre" ? `<button onclick="event.stopPropagation();openQrModal('${t.id}')" title="View / Print QR Label" class="p-2 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors">${i("qr", 16)}</button>` : ""}<button onclick="openDrawer('${t.id}')" class="btn-secondary text-xs px-3 py-1.5">${i("eye", 14)} Details</button></div></div><div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400 mb-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">${i("mapPin", 15, "text-brand-500")}<span class="font-medium">${t.location}</span>${i("arrowRight", 15, "text-slate-400")}<span class="font-medium">${t.destinationLab}</span><span class="ml-auto text-xs text-slate-400">Delivery: ${calcDeliveryTime(t)}</span></div></div>`,

          filtered.length === 0
            ? ""

        return `<div class="space-y-5 max-w-[1600px] mx-auto"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Transfer History</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Complete audit trail of all sample transfers</p></div><button onclick="exportHistoryToExcel()" class="btn-secondary text-xs px-3 py-2 self-start sm:self-auto">${i("download", 14)} Export to Excel</button></div><div class="card p-4 flex flex-col sm:flex-row gap-3"><div class="relative flex-1">${i("search", 17, "absolute left-3 top-1/2 -translate-y-1/2 text-slate-400")}<input class="input pl-9" value="${state.historyQuery}" onchange="state.historyQuery=this.value;state.historyPage=1;render()" placeholder="Search by MRN, patient name..."></div><select class="input sm:w-48" onchange="state.historyLocationFilter=this.value;state.historyPage=1;render()"><option value="">Pickup Location</option>${locationOptions.map((l) => `<option value="${l}" ${state.historyLocationFilter === l ? "selected" : ""}>${l}</option>`).join("")}</select></div><div class="space-y-4">${filtered.length === 0 ? `<div class="card p-12 text-center">${i("history", 32, "text-slate-300 mx-auto mb-3")}<p class="text-sm text-slate-500">No transfers match your filters</p></div>` : items}${pagination}</div></div>`;
      }

lass="card p-5"><div class="flex items-center justify-between mb-4"><div><h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers Per Day</h3><p class="text-xs text-slate-500 dark:text-slate-400">Last 7 days</p></div>${i("trendingUp", 18, "text-green-500")}</div>${LineChart(perDay, 200, "#2563eb")}</div><div class="card p-5"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Pending vs In Transit</h3><p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Status distribution</p><div class="flex justify-center py-2">${DonutChart(statusData, 160)}</div></div><div class="card p-5"><div class="flex items-center gap-2 mb-4">${i("building", 18, "text-brand-500")}<h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers by Location</h3></div>${BarChart(byDept, "#6366f1", 200)}</div><div class="card p-5"><div class="flex items-center gap-2 mb-4">${i("flask", 18, "text-brand-500")}<h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers to Lab</h3></div>${BarChart(byLab, "#16a34a", 200)}</div></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="card p-5 text-center"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-3">Completion Progress</h3><div class="flex justify-center py-3">${ProgressRing(completed.length, state.transfers.length, 140, "#16a34a", "Completed")}</div><p class="text-sm text-slate-500 dark:text-slate-400 mt-2">${completed.length} of ${state.transfers.length} transfers completed</p></div><div class="card p-5 lg:col-span-2"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">Delivery Time by Lab</h3><div class="space-y-3">${deliveryTimes}</div></div></div></div>`;
      }

      function renderSearchResults() {
        if (!state.searchQuery) {
          setPage("dashboard");
          return "";
        }
        const results = searchTransfers(state.searchQuery);
        const rows = results
          .map(
            (t) =>
              `<tr class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors cursor-pointer" onclick="openDrawer('${t.id}')"><td class="px-5 py-3 font-mono text-xs text-slate-500 dark:text-slate-400">${t.mrn}</td><td class="px-3 py-3 font-medium text-slate-700 dark:text-slate-300">${t.patientName}</td><td class="px-3 py-3 text-slate-600 dark:text-slate-400 hidden md:table-cell text-xs">${t.location}</td><td class="px-3 py-3 text-slate-600 dark:text-slate-400 hidden lg:table-cell text-xs">${t.destinationLab}</td><td class="px-3 py-3">${PriorityBadge(t.priority)}</td><td class="px-3 py-3">${StatusBadge(t.status)}</td><td class="px-3 py-3 text-xs text-slate-500 dark:text-slate-400 hidden sm:table-cell">${timeAgo(t.createdAt)}</td><td class="px-5 py-3 text-right"><button onclick="event.stopPropagation();openDrawer('${t.id}')" class="text-xs font-semibold text-brand-600 hover:text-brand-700">View</button></td></tr>`,
          )
          .join("");
        return `<div class="space-y-5 max-w-[1600px] mx-auto"><div class="flex items-center gap-3"><button onclick="state.searchQuery='';setPage('dashboard')" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${i("arrowLeft", 20)}</button><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Search Results</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${results.length} result${results.length !== 1 ? "s" : ""} for "<span class="font-semibold text-slate-700 dark:text-slate-300">${state.searchQuery}</span>"</p></div></div>${results.length === 0 ? `<div class="card p-12 text-center"><div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-4">${i("search", 28, "text-slate-400")}</div><h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">No results found</h3><p class="text-sm text-slate-500 mt-1">Try searching by MRN, patient name, location, lab, or status.</p></div>` : `<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30"><th class="px-5 py-3 font-semibold">MRN</th><th class="px-3 py-3 font-semibold">Patient</th><th class="px-3 py-3 font-semibold hidden md:table-cell">Location</th><th class="px-3 py-3 font-semibold hidden lg:table-cell">Lab</th><th class="px-3 py-3 font-semibold">Priority</th><th class="px-3 py-3 font-semibold">Status</th><th class="px-3 py-3 font-semibold hidden sm:table-cell">Created</th><th class="px-5 py-3 font-semibold text-right">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}</div>`;

      function renderQrModal() {
        if (!state.qrModalTransferId) return "";
        const t = getTransfer(state.qrModalTransferId);
        if (!t) return "";
        return `<div id="qrModalBackdrop" class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-fade-in no-print" onclick="closeQrModal()"></div><div id="qrModalCard" class="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-elevated animate-slide-in overflow-hidden"><div class="px-5 py-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800 no-print"><div><h3 class="text-base font-bold text-slate-900 dark:text-white">Sample Label</h3><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${t.mrn} &middot; ${t.patientName}</p></div><button onclick="closeQrModal()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${i("x", 20)}</button></div><div class="p-6 print-area flex flex-col items-center text-center gap-4"><div class="p-3 bg-white rounded-xl border border-slate-100 dark:border-slate-800">${qrCodeSVG(qrPayload(t), 180)}</div>${barcodeSVG(t.id, 44)}<div><p class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.id}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${t.mrn} &middot; ${t.patientName}</p><p class="text-xs text-slate-400 mt-2 max-w-[240px]">Scan at ward or lab to pull up this transfer instantly.</p></div></div><div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex items-center gap-2 no-print"><button onclick="window.print()" class="btn-secondary flex-1 justify-center">${i("printer", 16)}Print</button><button onclick="closeQrModal();openDrawer('${t.id}')" class="btn-primary flex-1 justify-center">View Full Details</button></div></div></div>`;
      }

      function renderDrawer() {
        if (!state.drawerTransferId) return "";

        if (!t) return "";
        const timelineItems = t.timeline
          .map(
            (ev, i) =>
              `<div class="relative pb-4 last:pb-0"><div class="absolute -left-4.5 w-4 h-4 rounded-full border-2 border-white dark:border-slate-900 ${i === t.timeline.length - 1 ? "bg-brand-500" : "bg-slate-300 dark:bg-slate-600"}" style="left:-1.125rem"></div><div class="ml-2"><p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${ev.label}</p><p class="text-xs text-slate-500 dark:text-slate-400">${ev.user} · ${ev.department}</p><p class="text-[11px] text-slate-400 mt-0.5">${formatDateTime(ev.timestamp)} · ${timeAgo(ev.timestamp)}</p>${ev.note ? `<p class="text-xs text-slate-600 dark:text-slate-400 mt-1 italic">"${ev.note}"</p>` : ""}</div></div>`,
          )
          .join("");
        const sampleItems = t.samples
          .map(
            (s) =>
              `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><div class="flex items-center justify-between mb-1"><span class="font-mono text-sm font-bold text-slate-800 dark:text-slate-200">${s.label}</span><div class="flex items-center gap-2"><span class="badge bg-brand-100 text-brand-700 dark:bg-brand-500/20 dark:text-brand-300">${s.specimenType}</span><span class="text-xs font-semibold text-slate-600 dark:text-slate-400">×${s.count}</span>${s.cytology ? '<span class="badge bg-purple-100 text-purple-700 dark:bg-purple-500/20 dark:text-purple-300">Cyt</span>' : ""}${s.received ? i("checkCircle", 14, "text-green-500") : ""}</div></div>${s.remarks ? `<p class="text-xs text-slate-500 dark:text-slate-400">${s.remarks}</p>` : ""}</div>`,
          )
          .join("");
        return `<div id="drawerBackdrop" class="fixed inset-0 z-40 flex justify-end"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in no-print" onclick="closeDrawer()"></div><div id="drawerCard" class="relative w-full max-w-xl bg-white dark:bg-slate-900 shadow-elevated animate-slide-in overflow-y-auto"><div class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-5 py-4 flex items-center justify-between no-print"><div><h3 class="text-lg font-bold text-slate-900 dark:text-white">Transfer Details</h3><p class="text-xs font-mono text-slate-500 mt-0.5">${t.id}</p></div><div class="flex items-center gap-2"><button onclick="window.print()" class="btn-secondary text-sm">${i("printer", 16)}Print</button><button onclick="closeDrawer()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${i("x", 20)}</button></div></div><div class="p-5 space-y-5"><div class="flex items-center gap-2 flex-wrap">${StatusBadge(t.status)}${PriorityBadge(t.priority)}${t.samples.some((s) => s.cytology) ? '<span class="badge bg-purple-100 text-purple-700 dark:bg-purple-500/20 dark:text-purple-300">Cytology</span>' : ""}</div><div><div class="flex items-center gap-2 mb-3">${i("user", 16, "text-brand-500")}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Patient Information</h4></div><div class="grid grid-cols-2 gap-3"><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">MRN</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-mono">${t.mrn}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Patient Name</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.patientName}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Location</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.location}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Area</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.department}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Consultant</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.consultant}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Destination Lab</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.destinationLab}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Collection</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.collectionDate} ${t.collectionTime}</p></div></div></div><div><div class="flex items-center gap-2 mb-3">${i("flask", 16, "text-brand-500")}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Samples (${t.samples.length})</h4></div><div class="space-y-2">${sampleItems}</div></div>${t.transferNotes ? `<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/20"><p class="text-xs font-semibold text-amber-700 dark:text-amber-400 mb-1">Transfer Notes</p><p class="text-sm text-amber-800 dark:text-amber-300">${t.transferNotes}</p></div>` : ""}${t.labNotes ? `<div class="p-3 rounded-xl bg-cyan-50 dark:bg-cyan-500/10 border border-cyan-200 dark:border-cyan-500/20"><p class="text-xs font-semibold text-cyan-700 dark:text-cyan-400 mb-1">Lab Notes</p><p class="text-sm text-cyan-800 dark:text-cyan-300">${t.labNotes}</p></div>` : ""}<div class="no-print"><div class="flex items-center gap-2 mb-3">${i("qr", 16, "text-brand-500")}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Transfer ID &amp; Barcode</h4></div><div class="flex items-center gap-6 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 flex-wrap">${qrCodeSVG(qrPayload(t), 120)}<div class="flex flex-col gap-2">${barcodeSVG(t.id, 40)}<p class="text-[11px] text-slate-400 max-w-[220px]">Scan at ward or lab to pull up this transfer instantly.</p></div></div></div><div class="hidden print:flex print-area flex-col items-center text-center gap-4 p-6"><div class="p-3 bg-white rounded-xl border border-slate-100 dark:border-slate-800">${qrCodeSVG(qrPayload(t), 180)}</div>${barcodeSVG(t.id, 44)}<div><p class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.id}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${t.mrn} &middot; ${t.patientName}</p><p class="text-xs text-slate-400 mt-2 max-w-[240px] mx-auto">Scan at ward or lab to pull up this transfer instantly.</p></div></div></div></div></div>`;
      }

      function renderToasts() {
        const icons2 = {
          success: i("checkCircle", 20, "text-green-500"),
          error: i("xCircle", 20, "text-danger-500"),
          info: i("info", 20, "text-brand-500"),
          warning: i("alert", 20, "text-amber-500"),
        };
        const borders = {
          success: "border-l-green-500",
          error: "border-l-red-500",
          info: "border-l-brand-500",
          warning: "border-l-amber-500",
        };
        return `<div class="fixed top-20 right-4 z-[60] flex flex-col gap-3 w-full max-w-sm">${state.toasts.map((toast) => `<div class="card shadow-elevated border-l-4 ${borders[toast.type]} px-4 py-3.5 flex items-start gap-3 animate-slide-in">${icons2[toast.type]}<p class="text-sm font-medium text-slate-700 dark:text-slate-200 flex-1">${toast.message}</p><button onclick="dismissToast('${toast.id}')" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">${i("x", 16)}</button></div>`).join("")}</div>`;
      }

      function renderConfirmModal() {
        if (!state.confirmModal) return "";
        const m = state.confirmModal;
        return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in" onclick="state.confirmModal=null;render()"></div><div class="relative w-full max-w-md card shadow-elevated animate-scale-in"><div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800"><h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">${m.title}</h3></div><div class="px-6 py-5">${m.message ? `<p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${m.message}</p>` : ""}</div><div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3"><button onclick="state.confirmModal=null;render()" class="btn-secondary">Cancel</button><button onclick="(${m.onConfirm.toString()})()" class="btn-danger">Confirm</button></div></div></div>`;
      }

      // ============= MAIN RENDER =============
      function login(persona) {
        if (!state.loginName.trim()) {
          showToast("warning", "Please enter your name to sign in");
          return;
        }
        state.persona = persona;
        state.loggedIn = true;
        state.currentPage = "dashboard";
        state.currentUser =
          persona === "theatre"
            ? {
                name: state.loginName,
                role: "Theatre Staff",
                initials: initialsOf(state.loginName),
              }
            : {
                name: state.loginName,
                role: "Laboratory Staff",
                initials: initialsOf(state.loginName),
              };
        localStorage.setItem(
          "labtrack_session",
          JSON.stringify({
            persona: state.persona,
            loginName: state.loginName,
            currentUser: state.currentUser,
          }),
        );
        render();
      }

      function logout() {
        state.loggedIn = false;
        state.loginName = "";
        state.currentPage = "dashboard";
        state.profileOpen = false;
        localStorage.removeItem("labtrack_session");
        render();
      }

      function initialsOf(name) {
        return (
          name
            .trim()
            .split(/\s+/)
            .map((w) => w[0])
            .join("")
            .toUpperCase()
            .slice(0, 2) || "U"
        );
      }

      function renderLogin() {
        return `<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <div class="w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30 mx-auto mb-4">${i("building", 28, "text-white")}</div>
          <h1 class="text-xl font-bold text-slate-900 dark:text-white">LabTrack</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">National University Hospital</p>
        </div>
        <div class="card p-6 space-y-5">
          <div><label class="label">Your Name</label><input id="loginNameInput" class="input" placeholder="e.g. Sarah O'Sullivan" value="${state.loginName}" onkeydown="if(event.key==='Enter')document.getElementById('loginContinue')?.click()" onchange="state.loginName=this.value"></div>
          <div>
            <label class="label">Sign in as</label>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="state.loginName=document.getElementById('loginNameInput').value;login('theatre')" class="flex flex-col items-center gap-2 p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-all group">
                <div class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800 group-hover:bg-brand-100 dark:group-hover:bg-brand-500/20 flex items-center justify-center transition-colors">${i("truck", 22, "text-slate-500 group-hover:text-brand-600 dark:group-hover:text-brand-400")}</div>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">Theatre</span>
                <span class="text-[11px] text-slate-400 text-center leading-tight">Create &amp; track transfers</span>
              </button>
              <button onclick="state.loginName=document.getElementById('loginNameInput').value;login('lab')" class="flex flex-col items-center gap-2 p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-all group">
                <div class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800 group-hover:bg-brand-100 dark:group-hover:bg-brand-500/20 flex items-center justify-center transition-colors">${i("flask", 22, "text-slate-500 group-hover:text-brand-600 dark:group-hover:text-brand-400")}</div>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">Laboratory</span>
                <span class="text-[11px] text-slate-400 text-center leading-tight">Receive &amp; process samples</span>
              </button>
            </div>
          </div>
        </div>
        <p class="text-center text-[11px] text-slate-400 mt-5">You'll only see the pages relevant to your role. Sign out from your profile menu to switch.</p>
      </div>
    </div>`;
      }

      function render() {
        if (typeof closeAllHistCombos === "function") closeAllHistCombos();
        if (!state.loggedIn) {
          document.getElementById("app").innerHTML = renderLogin();
          return;
        }

        // Preserve focus/cursor/scroll across the full re-render so typing or
        // picking a dropdown doesn't feel like the page "refreshed".
        const active = document.activeElement;
        let restore = null;
        if (
          active &&
          ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName) &&
          document.getElementById("app").contains(active)
        ) {
          restore = {
            tag: active.tagName.toLowerCase(),
            onchange: active.getAttribute("onchange"),
            oninput: active.getAttribute("oninput"),
            selStart:
              typeof active.selectionStart === "number"
                ? active.selectionStart
                : null,
            selEnd:
              typeof active.selectionEnd === "number"
                ? active.selectionEnd
                : null,
          };
        }
        const scrollEl = document.scrollingElement || document.documentElement;
        const scrollTop = scrollEl.scrollTop;

        let content = "";
        if (state.searchQuery) {
          content = renderSearchResults();
        } else {
          switch (state.currentPage) {
            case "dashboard":
              content =
                state.persona === "lab" ? renderLabHome() : renderDashboard();
              break;
            case "create":
              content = renderCreateTransfer();
              break;
            case "receive":
              content = renderLabReceive();
              break;
            case "history":
              content = renderHistory();
              break;
            case "reports":
              content = renderReports();
              break;
            default:
              content = renderDashboard();
          }
        }
        document.getElementById("app").innerHTML =
          renderAppShell(content) +
          renderDrawer() +
          renderQrModal() +
          renderToasts() +
          renderConfirmModal();

        if (restore) {
          const candidates = document.getElementsByTagName(restore.tag);
          for (const el of candidates) {
            if (
              el.getAttribute("onchange") === restore.onchange &&
              el.getAttribute("oninput") === restore.oninput
            ) {
              el.focus({ preventScroll: true });
              if (restore.selStart !== null && el.setSelectionRange) {
                try {
                  el.setSelectionRange(restore.selStart, restore.selEnd);
                } catch (e) {}
              }
              break;
            }
          }
        }
        scrollEl.scrollTop = scrollTop;
      }

      // Restore session if one exists
      const savedSession = localStorage.getItem("labtrack_session");
      if (savedSession) {
        try {
          const s = JSON.parse(savedSession);
          if (s.persona && PERSONA_PAGES[s.persona]) {
            state.loggedIn = true;
            state.persona = s.persona;
            state.loginName = s.loginName;
            state.currentUser = s.currentUser;
          } else {
            localStorage.removeItem("labtrack_session");
          }
        } catch (e) {
          localStorage.removeItem("labtrack_session");
        }
      }

      // Initialize
      render();
    </script>
  </body>
</html>
